name: nflverse season matrix
description: >
  Computes the current NFL season and a JSON array of seasons to update, for
  use as a job matrix. Plain bash + jq + GNU date (all on GitHub's Ubuntu
  runners and in ghcr.io/nflverse/r-runner), so no R setup is needed.
  Replaces nflverse.workflows::get_current_season() and get_season_range().

inputs:
  first-season:
    description: First season of the data. Used for full rebuilds and to validate season-rebuild.
    required: true
  roster:
    description: >
      Roster season logic: the new season starts on March 15th. Otherwise it
      starts on the Wednesday after Labor Day (first Monday in September).
    required: false
    default: "false"
  season-rebuild:
    description: >
      Seasons to update, comma separated, e.g. "2017,2019,2021". Empty or 9999
      means the current season. Pass a workflow_dispatch input through.
    required: false
    default: "9999"
  full-rebuild:
    description: Update all seasons from first-season to the current season. Overrides season-rebuild.
    required: false
    default: "false"

outputs:
  seasons:
    description: JSON array of seasons, e.g. [2026] or [2016,2017,...]
    value: ${{ steps.seasons.outputs.seasons }}
  current-season:
    description: The current season, e.g. 2026
    value: ${{ steps.seasons.outputs.current-season }}

runs:
  using: composite
  steps:
    - id: seasons
      shell: bash
      env:
        FIRST_SEASON: ${{ inputs.first-season }}
        ROSTER: ${{ inputs.roster }}
        SEASON_REBUILD: ${{ inputs.season-rebuild }}
        FULL_REBUILD: ${{ inputs.full-rebuild }}
      run: |
        set -euo pipefail

        if ! [[ "$FIRST_SEASON" =~ ^[0-9]{4}$ ]]; then
          echo "::error title=season-matrix::first-season must be a year, got '$FIRST_SEASON'"
          exit 1
        fi

        year=$(date -u +%Y)
        today=$(date -u +%Y%m%d)
        if [ "$ROSTER" == "true" ]; then
          season_start="${year}0315"
        else
          sep1_dow=$(date -u -d "$year-09-01" +%u) # 1 = Monday ... 7 = Sunday
          labor_day=$(date -u -d "$year-09-01 +$(( (8 - sep1_dow) % 7 )) days" +%F)
          season_start=$(date -u -d "$labor_day +2 days" +%Y%m%d)
        fi
        if [ "$today" -ge "$season_start" ]; then
          current_season=$year
        else
          current_season=$((year - 1))
        fi

        # strip whitespace, e.g. "2017, 2019"
        season_input="${SEASON_REBUILD//[[:space:]]/}"

        if [ "$FULL_REBUILD" == "true" ]; then
          seasons=$(jq -cn --argjson from "$FIRST_SEASON" --argjson to "$current_season" '[range($from; $to + 1)]')

        elif [ -z "$season_input" ] || [[ "$season_input" =~ ^9999(\.0+)?$ ]]; then
          seasons="[$current_season]"

        else
          # Accepts "2017,2019,2021" as well as "2017.0" (number inputs from
          # the mobile app). Fails on anything that isn't a valid season.
          seasons=$(jq -cn --arg s "$season_input" --argjson from "$FIRST_SEASON" --argjson to "$current_season" '
            $s | split(",") | map(select(length > 0) | sub("\\.0+$"; "") | tonumber)
            | if length > 0 and all(. == floor and . >= $from and . <= $to)
              then unique
              else error("Invalid season input: \($s). Allowed: \($from)-\($to)")
              end')
        fi

        echo "Current season: $current_season | Seasons: $seasons"
        {
          echo "seasons=$seasons"
          echo "current-season=$current_season"
        } >> "$GITHUB_OUTPUT"
