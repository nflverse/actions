# Third-party action versions live in this repo only. Data repos reference
# nflverse/actions/<action>@v1 and get these bumps without changes.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/setup"
      - "/season-matrix"
      - "/commit-and-push"
      - "/install-rclone"
      - "/upload-timestamps"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # R minor version of the image base (rocker/r-ver:4.6 -> 4.7). Its PR build
  # can't push (read-only token): run "Build r-runner image" with
  # workflow_dispatch on the Dependabot branch to test the image.
  - package-ecosystem: docker
    directory: "/images/r-runner"
    schedule:
      interval: weekly
