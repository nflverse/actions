on:
  push:
    branches: [main]
    paths:
      - "images/r-runner/**"
      - ".github/workflows/build-r-runner.yaml"
  # build only (no push) to verify changes before they land on main
  pull_request:
    paths:
      - "images/r-runner/**"
      - ".github/workflows/build-r-runner.yaml"
  schedule:
    # Weekly rebuild (Tuesday 6:17 UTC) to pick up new R and CRAN package
    # releases. GitHub packages are refreshed in every job by the setup action.
    - cron: "17 6 * * 2"
  workflow_dispatch:

name: Build r-runner image

permissions:
  contents: read
  packages: write

concurrency:
  group: build-r-runner-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/nflverse/r-runner

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "$IMAGE:latest"
            echo "$IMAGE:$(date -u +%Y-%m-%d)"
            echo "$IMAGE:${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: images/r-runner
          push: ${{ github.event_name != 'pull_request' }}
          # always start fresh, otherwise cached layers keep old packages
          no-cache: true
          pull: true
          tags: ${{ steps.tags.outputs.tags }}
