on:
  push:
    branches: [main]
    paths-ignore:
      - "images/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "images/**"
      - "**.md"
  # build-r-runner.yaml runs these tests against every new image before it
  # becomes latest
  workflow_call:
    inputs:
      image:
        type: string
        required: false
        default: ghcr.io/nflverse/r-runner:latest
  workflow_dispatch:
    inputs:
      image:
        description: Image to test, e.g. a test-<branch> tag pushed by a branch build
        required: false
        default: ghcr.io/nflverse/r-runner:latest

name: Test actions

permissions:
  contents: read

# run steps in container jobs default to sh, not bash
defaults:
  run:
    shell: bash

jobs:
  season-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: current
        uses: ./season-matrix
        with:
          first-season: 2016

      - id: full
        uses: ./season-matrix
        with:
          first-season: 2016
          full-rebuild: true

      - id: list
        uses: ./season-matrix
        with:
          first-season: 2016
          season-rebuild: "2019, 2017.0,2019"

      - id: roster
        uses: ./season-matrix
        with:
          first-season: 1999
          roster: true

      - id: invalid
        continue-on-error: true
        uses: ./season-matrix
        with:
          first-season: 2016
          season-rebuild: "2015"

      - name: Check outputs
        env:
          CURRENT: ${{ steps.current.outputs.seasons }}
          CURRENT_SEASON: ${{ steps.current.outputs.current-season }}
          FULL: ${{ steps.full.outputs.seasons }}
          LIST: ${{ steps.list.outputs.seasons }}
          ROSTER: ${{ steps.roster.outputs.current-season }}
          INVALID: ${{ steps.invalid.outcome }}
        run: |
          set -euo pipefail
          test "$CURRENT" == "[$CURRENT_SEASON]"
          test "$(jq 'first' <<< "$FULL")" == 2016
          test "$(jq 'last' <<< "$FULL")" == "$CURRENT_SEASON"
          test "$LIST" == "[2017,2019]"
          # the roster season starts before (or with) the regular season
          test "$ROSTER" -ge "$CURRENT_SEASON"
          test "$INVALID" == "failure"
          echo "All season-matrix checks passed"

  setup:
    runs-on: ubuntu-latest
    container: ${{ inputs.image || 'ghcr.io/nflverse/r-runner:latest' }}
    steps:
      # The action under test lives in this repo, so check out first and turn
      # the action's own checkout off
      - uses: actions/checkout@v7

      - name: Run setup (public GitHub packages)
        uses: ./setup
        with:
          checkout: false
          packages: nflverse/nflreadr, nflverse/nflverse-data nflfastR=nflverse/nflfastR

      - name: Check results
        run: |
          Rscript -e '
            for (p in c("nflreadr", "nflversedata", "nflfastR")) {
              sha <- packageDescription(p, fields = "RemoteSha")
              head <- gh::gh(paste0("/repos/nflverse/", c(nflreadr = "nflreadr", nflversedata = "nflverse-data", nflfastR = "nflfastR")[[p]], "/commits/HEAD"))$sha
              cat(p, sha, head, "\n")
              stopifnot(identical(sha, head))
            }
          '
        env:
          GITHUB_PAT: ${{ github.token }}

  setup-local:
    runs-on: ubuntu-latest
    container: ${{ inputs.image || 'ghcr.io/nflverse/r-runner:latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: actions

      # A minimal package in the workspace root, like a data repo that is an
      # R package (nflverse-pfr, nflverse-ftn, ...). praise is not in the
      # image, so install-deps has to install it.
      - name: Create a test package
        run: |
          mkdir -p R
          cat > DESCRIPTION <<'EOF'
          Package: nflversetestpkg
          Version: 0.0.1
          Title: Test Package
          Description: Test package for the setup action.
          License: MIT
          Imports: nflreadr, cli (>= 3.0.0), praise
          EOF
          echo 'hello <- function() praise::praise()' > R/hello.R
          echo 'export(hello)' > NAMESPACE

      - name: Run setup
        uses: ./actions/setup
        with:
          checkout: false
          install-local: true

      - name: Check results
        run: Rscript -e 'nflversetestpkg::hello(); stopifnot(requireNamespace("praise"))'

  # The private package path: no r-universe binary, GitHub install with the
  # read-only org secret NFLVERSE_READ_TOKEN
  setup-private:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container: ${{ inputs.image || 'ghcr.io/nflverse/r-runner:latest' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check secret
        env:
          READ_TOKEN: ${{ secrets.NFLVERSE_READ_TOKEN }}
        run: |
          if [ -z "$READ_TOKEN" ]; then
            echo "::error::The org secret NFLVERSE_READ_TOKEN isn't available to this repo"
            exit 1
          fi

      - name: Run setup (private GitHub package)
        uses: ./setup
        with:
          checkout: false
          packages: nflverse/nflapi
          github-pat: ${{ secrets.NFLVERSE_READ_TOKEN }}

      - name: Check results
        env:
          GITHUB_PAT: ${{ secrets.NFLVERSE_READ_TOKEN }}
        run: |
          Rscript -e '
            loadNamespace("nflapi")
            sha <- packageDescription("nflapi", fields = "RemoteSha")
            head <- gh::gh("/repos/nflverse/nflapi/commits/HEAD")$sha
            cat("nflapi", format(packageVersion("nflapi")), sha, head, "\n")
            stopifnot(identical(sha, head))
          '

  commit-and-push:
    strategy:
      fail-fast: false
      matrix:
        container: ["", "${{ inputs.image || 'ghcr.io/nflverse/r-runner:latest' }}"]
    name: commit-and-push (${{ matrix.container || 'runner' }})
    runs-on: ubuntu-latest
    # an empty image runs the job on the runner itself
    container:
      image: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: actions

      # A local bare repo as "origin", so the test never pushes anywhere real
      - name: Create test repos
        run: |
          set -euo pipefail
          git config --global init.defaultBranch main
          git config --global user.name test && git config --global user.email test@example.com
          git init -q --bare "$RUNNER_TEMP/origin.git"
          git clone -q "$RUNNER_TEMP/origin.git" work
          git -C work commit -q --allow-empty -m init && git -C work push -q origin main
          # a concurrent push the action has to rebase onto
          git clone -q "$RUNNER_TEMP/origin.git" "$RUNNER_TEMP/other"
          echo other > "$RUNNER_TEMP/other/other.txt"
          git -C "$RUNNER_TEMP/other" add other.txt && git -C "$RUNNER_TEMP/other" commit -q -m other
          git -C "$RUNNER_TEMP/other" push -q origin main
          echo data > work/data.csv

      - id: changed
        uses: ./actions/commit-and-push
        with:
          paths: data.csv
          message: Update test data
          working-directory: work

      - id: unchanged
        uses: ./actions/commit-and-push
        with:
          paths: data.csv
          working-directory: work

      - name: Check results
        env:
          CHANGED: ${{ steps.changed.outputs.committed }}
          UNCHANGED: ${{ steps.unchanged.outputs.committed }}
        run: |
          set -euo pipefail
          test "$CHANGED" == "true"
          test "$UNCHANGED" == "false"
          git clone -q "$RUNNER_TEMP/origin.git" "$RUNNER_TEMP/check"
          test -f "$RUNNER_TEMP/check/data.csv"
          test -f "$RUNNER_TEMP/check/other.txt"
          git -C "$RUNNER_TEMP/check" log --oneline

  install-rclone:
    strategy:
      fail-fast: false
      matrix:
        container: ["", "${{ inputs.image || 'ghcr.io/nflverse/r-runner:latest' }}"]
    name: install-rclone (${{ matrix.container || 'runner' }})
    runs-on: ubuntu-latest
    # an empty image runs the job on the runner itself
    container:
      image: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./install-rclone
      # no "| grep -q": grep exits on the first match and rclone gets SIGPIPE
      # (exit 141 under pipefail)
      - run: '[[ "$(rclone version)" == *"rclone v1.76.0"* ]]'

  # Every repo that uses (or will use) the image: its GitHub packages and the
  # dependencies in its DESCRIPTION must install and load. Catches a missing
  # system library or a broken package before a data job does. Keep the list
  # in sync with the migration table in ROLLOUT.md.
  consumers:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      # GitHub Free: 20 concurrent jobs org-wide, shared with the data repos
      max-parallel: 4
      matrix:
        include:
          - repo: nflverse-pbp
            packages: nflverse/nflfastR nflverse/nflreadr nflverse/nflverse-data
          - repo: nflverse-pbp-internal
            packages: nflverse/nflapi nflverse/nflverse-data nflverse/nflreadr
          - repo: ngs-data
            packages: nflverse/nflverse-data nflverse/nflreadr
          - repo: nflverse-players
            packages: nflverse/nflapi nflverse/nflverse-espn nflverse/nflverse-data nflverse/nflreadr nflverse/undercover
          - repo: nflverse-ftn
            packages: nflverse/nflverse-data nflverse/nflreadr
          - repo: nflverse-rosters
            packages: nflverse/nflapi nflverse/ngsscrapR nflverse/nflverse-espn nflverse/nflverse-players nflverse/nflverse-data nflverse/nflreadr nflverse/nfldx
          - repo: nflverse-pfr
            packages: nflverse/nflverse-data nflverse/undercover
          - repo: rotc
            packages: nflverse/nflverse-data nflverse/nflreadr
          - repo: espnscrapeR-data
            packages: jthomasmock/espnscrapeR nflverse/nflverse-data nflverse/nflreadr
          - repo: nfldata
            packages: nflverse/nflverse-data
          - repo: nflverse-data
            packages: nflverse/nflverse-data nflverse/nflreadr
    name: consumer ${{ matrix.repo }}
    runs-on: ubuntu-latest
    container: ${{ inputs.image || 'ghcr.io/nflverse/r-runner:latest' }}
    env:
      REPO: nflverse/${{ matrix.repo }}
      PACKAGES: ${{ matrix.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: actions

      # The consumer's DESCRIPTION in the workspace root, so setup installs
      # its dependencies like it does in the consumer's own jobs
      - name: Get DESCRIPTION of ${{ matrix.repo }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if content=$(gh api "repos/$REPO/contents/DESCRIPTION" --jq .content 2> /dev/null); then
            base64 -d <<< "$content" > DESCRIPTION
            grep -E '^(Package|Depends|Imports):' DESCRIPTION || true
          else
            echo "$REPO has no DESCRIPTION, only checking its packages"
          fi

      - name: Run setup
        uses: ./actions/setup
        with:
          checkout: false
          packages: ${{ matrix.packages }}
          github-pat: ${{ secrets.NFLVERSE_READ_TOKEN }}

      # setup never fails the job, loading everything is the real check
      - name: Load packages
        env:
          GITHUB_PAT: ${{ secrets.NFLVERSE_READ_TOKEN }}
        run: |
          Rscript -e '
            refs <- strsplit(trimws(Sys.getenv("PACKAGES")), "[[:space:],]+")[[1]]
            pkg_name <- function(ref) {
              if (grepl("=", ref, fixed = TRUE)) return(sub("=.*", "", ref))
              desc <- gh::gh(paste0("/repos/", ref, "/contents/DESCRIPTION"))
              txt <- rawToChar(jsonlite::base64_dec(gsub("\n", "", desc$content)))
              read.dcf(textConnection(txt), fields = "Package")[1, 1]
            }
            pkgs <- vapply(refs, pkg_name, character(1), USE.NAMES = FALSE)
            if (file.exists("DESCRIPTION")) {
              d <- read.dcf("DESCRIPTION")
              fields <- intersect(c("Depends", "Imports", "LinkingTo"), colnames(d))
              deps <- trimws(sub("[(].*", "", unlist(strsplit(d[1, fields], ","))))
              base <- rownames(installed.packages(priority = "base"))
              pkgs <- c(pkgs, setdiff(deps[nzchar(deps)], c("R", base)))
            }
            failed <- character()
            for (p in unique(pkgs)) {
              ok <- tryCatch({
                loadNamespace(p)
                cat("ok  ", p, format(packageVersion(p)), "\n")
                TRUE
              }, error = function(e) {
                msg <- gsub("\n", "%0A", conditionMessage(e), fixed = TRUE)
                cat("::error title=", Sys.getenv("REPO"), ": ", p, "::", msg, "\n", sep = "")
                FALSE
              })
              if (!ok) failed <- c(failed, p)
            }
            if (length(failed) > 0) stop("Packages that do not load: ", paste(failed, collapse = ", "))
          '
