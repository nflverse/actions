name: nflverse upload timestamps
description: >
  Uploads timestamp.txt and timestamp.json once per release instead of once
  per matrix job. A release only gets a new timestamp if at least one of its
  data files was updated since started-at, i.e. at least one job writing to it
  succeeded. Run it in a final job with if: !cancelled().

inputs:
  releases:
    description: >
      Releases to update, one per line as "owner/repo tag", e.g.
      "nflverse/nflverse-data pbp".
    required: true
  started-at:
    description: >
      UTC time the run started as YYYY-MM-DDTHH:MM:SSZ. Write it to an output
      in the first job: date -u +%Y-%m-%dT%H:%M:%SZ
    required: true
  token:
    description: Token with write access to the releases.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        RELEASES: ${{ inputs.releases }}
        STARTED_AT: ${{ inputs.started-at }}
      run: |
        set -euo pipefail

        if ! [[ "$STARTED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
          echo "::error title=upload-timestamps::started-at must look like 2026-09-10T12:00:00Z, got '$STARTED_AT'"
          exit 1
        fi

        # Same format as nflversedata::nflverse_upload(), i.e.
        # format(Sys.time(), tz = nflreadr::nflverse_data_timezone, usetz = TRUE)
        now=$(TZ=America/Toronto date '+%Y-%m-%d %H:%M:%S %Z')
        dir=$(mktemp -d)
        printf '%s\n' "$now" > "$dir/timestamp.txt"
        printf '{"last_updated":"%s"}\n' "$now" > "$dir/timestamp.json"

        failed=0
        while read -r repo tag; do
          [ -z "$repo" ] && continue
          id=$(gh api "repos/$repo/releases/tags/$tag" --jq .id)
          # data assets (not timestamps) uploaded since the run started
          updated=$(gh api --paginate "repos/$repo/releases/$id/assets?per_page=100" \
            --jq "[.[] | select((.name | startswith(\"timestamp.\") | not) and .updated_at >= \"$STARTED_AT\")] | length" \
            | awk '{ n += $1 } END { print n + 0 }')

          if [ "$updated" -eq 0 ]; then
            echo "::warning title=upload-timestamps::No file in $repo@$tag was updated in this run. Keeping its timestamp."
            continue
          fi

          # retry random GitHub server errors
          for attempt in 1 2 3 4 5; do
            if gh release upload "$tag" "$dir/timestamp.txt" "$dir/timestamp.json" -R "$repo" --clobber; then
              echo "Updated timestamp of $repo@$tag ($updated files updated in this run): $now"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error title=upload-timestamps::Failed to upload timestamps to $repo@$tag"
              failed=1
            else
              sleep $(( attempt * 30 ))
            fi
          done
        done <<< "$RELEASES"

        rm -rf "$dir"
        exit "$failed"
